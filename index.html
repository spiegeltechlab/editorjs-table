<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Test of a New Beautiful Table</title>

  <style>
    body,
    html {
      margin: 0;
      font-family: Roboto, Oxygen, Ubuntu, Cantarell, Fira Sans, Droid Sans, Helvetica Neue, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .block {
      width: 800px;
      margin-top: 40px;
    }

    #editorjs {
      width: 900px;
      min-height: 100px;
    }
  </style>

</head>

<body>

  <div class="block"></div>
  <div id="editorjs"></div>

  <button class="save-button">Save</button>
  <pre class="output"></pre>

  <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>

  <script type="module">
    import Table from './src/index'
    const editor = new EditorJS({
      autofocus: true,
      tools: {
        table: {
          class: Table,
          inlineToolbar: true,
          config: {
            withHeadings: true,
            maxRows: 5,
            maxCols: 5
          }
        }
      },
      data: {
        time: 1625072989362,
        blocks: [
          {
            "id": "5gq3oadmemj1",
            "type": "table",
            "data": {
              "content": [
                {
                  "id": "4ulft1urhfo9",
                  "content": [
                    {
                      "id": "rnuowkccmlq",
                      "content": [
                        {
                          "id": "vuugaqhdjruk",
                          "type": "paragraph",
                          "data": { "text": "<b>Pro</b>" }
                        }
                      ],
                      heading: true,
                    },
                    {
                      "id": "u6s1zv998bn",
                      "content": [
                        {
                          "id": "ts31tyfksj9s",
                          "type": "paragraph",
                          "data": { "text": "<b>Kontra</b>" }
                        }
                      ],
                    }
                  ]
                },
                {
                  "id": "edzf5xsnnw4n",
                  "content": [
                    {
                      "id": "zkgvon0flk",
                      "content": [
                        {
                          "id": "zfvdps3liy0a",
                          "type": "paragraph",
                          "data": { "text": "Einfacher Aufbau; großer Spielspaß" }
                        },
                        {
                          "id": "zfvdps3liy0a",
                          "type": "paragraph",
                          "data": { "text": "Einfacher Aufbau; großer Spielspaß" }
                        }
                      ],
                    },
                    {
                      "id": "988cim3xlbn",
                      "content": [
                        {
                          "id": "r9pcifurn99u",
                          "type": "paragraph",
                          "data": { "text": "Warum gewinnen immer die Anderen?" }
                        }
                      ],
                      heading: true,
                    }
                  ]
                }
              ]
            }
          }
        ],
        version: "2.22.1"
      }
    });

    const saveButton = document.querySelector('.save-button');
    const output = document.querySelector('.output');

    saveButton.addEventListener('click', () => {
      editor.save().then(savedData => {
        output.innerHTML = JSON.stringify(savedData, null, 4);
      });
    });
  </script>
</body>

</html>
