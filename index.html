<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Test of a New Beautiful Table</title>

  <style>
    body,
    html {
      margin: 0;
      font-family: Roboto, Oxygen, Ubuntu, Cantarell, Fira Sans, Droid Sans, Helvetica Neue, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .block {
      width: 800px;
      margin-top: 40px;
    }

    #editorjs {
      width: 900px;
      min-height: 100px;
    }
  </style>

</head>

<body>

  <div class="block"></div>
  <div id="editorjs"></div>

  <button class="save-button">Save</button>
  <pre class="output"></pre>

  <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>

  <script type="module">
    import Table from './src/index'
    const editor = new EditorJS({
      autofocus: true,
      tools: {
        table: {
          class: Table,
          inlineToolbar: true,
          config: {
            maxRows: 5,
            maxCols: 5
          }
        }
      },
      data: {
        time: 1625072989362,
        blocks: [
          {
            id: "aXVTfnMlcE",
            type: "paragraph",
            data: {
              text: 'DEFAULT TABELLE:'
            }
          },
          {
            id: "XXVTfnMlcE",
            type: "table",
            data: {
              content: [
                [ { text: "A1", rowspan: 1, colspan: 1 }, { text: "B1" }, ],
                [ { text: "A2" }, { text: "B2", rowspan: 1, colspan: 1 } ],
                [ { text: "A3" }, { text: "B3" } ]
              ],
            }
          },
          {
            id: "bXVTfnMlcE",
            type: "paragraph",
            data: {
              text: 'COLSPAN TABELLE:'
            }
          },
          {
            id: "XXVTflMlcE",
            type: "table",
            data: {
              content: [
                [ { text: "A1 - colspan 2", rowspan: 1, colspan: 2 } ],
                [ { text: "A2" }, { text: "B2", rowspan: 1, colspan: 1 } ],
                [ { text: "A3 - colspan 2", rowspan: 1, colspan: 2 } ],
                [ { text: "A4" }, { text: "B4", rowspan: 1, colspan: 1 } ],
              ],
            }
          },
          {
            id: "cXVTfnMlcE",
            type: "paragraph",
            data: {
              text: 'ROWSPAN TABELLE:'
            }
          },
          {
            id: "XXVTfwMlcE",
            type: "table",
            data: {
              content: [
                [ { text: "A1 - rowspan 2", rowspan: 2, colspan: 1 }, { text: "B1" }, ],
                [ { text: "B2", rowspan: 1, colspan: 1 } ],
                [ { text: "A3" }, { text: "B3" } ]
              ],
            }
          }
        ],
        version: "2.22.1"
      }
    });

    const saveButton = document.querySelector('.save-button');
    const output = document.querySelector('.output');

    saveButton.addEventListener('click', () => {
      editor.save().then(savedData => {
        output.innerHTML = JSON.stringify(savedData, null, 4);
      });
    });
  </script>
</body>

</html>
